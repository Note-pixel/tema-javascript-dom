<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Desenvolvimento Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #333333;
            text-align: center;
        }
        .campo {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555555;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        .mensagem {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
        .erro {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .sucesso {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Formulário de Cadastro</h2>
        
        <form id="formCadastro">
            <div class="campo">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="campo">
                <label for="email">E-mail Institucional:</label>
                <input type="email" id="email" placeholder="exemplo@instituicao.com" required>
            </div>

            <div class="campo">
                <label for="senha">Senha de Acesso:</label>
                <input type="password" id="senha" minlength="6" placeholder="Mínimo 6 caracteres" required>
            </div>

            <div class="campo">
                <label for="confirmaSenha">Confirmação de Senha:</label>
                <input type="password" id="confirmaSenha" placeholder="Repita a senha" required>
            </div>

            <div class="campo">
                <label for="perfil">Perfil Técnico:</label>
                <select id="perfil" required>
                    <option value="">Selecione uma área...</option>
                    <option value="Redes">Redes</option>
                    <option value="Desenvolvimento">Desenvolvimento</option>
                    <option value="Suporte">Suporte</option>
                </select>
            </div>

            <div class="campo checkbox-container">
                <input type="checkbox" id="termos" required>
                <label for="termos">Aceito os Termos de Uso</label>
            </div>

            <button type="submit">Cadastrar</button>
        </form>

        <div id="mensagemStatus" class="mensagem"></div>
    </div>

    <script src="forscript.js"></script>
</body>
</html>
